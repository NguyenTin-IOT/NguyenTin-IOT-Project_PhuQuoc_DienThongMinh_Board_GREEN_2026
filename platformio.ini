; PlatformIO Project Configuration File
; PQ-TWINROOM - Hotel Room Controller
; MCU: STM32F103VCT6 (256KB Flash, 48KB SRAM)

[env:genericSTM32F103VC]
platform = ststm32
board = genericSTM32F103VC
framework = arduino

; Upload & Debug
upload_protocol = stlink
debug_tool = stlink

; Build flags
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; Serial Monitor
monitor_speed = 115200

; Library dependencies (uncomment if needed)
; lib_deps =
;     jandrassy/EthernetENC@^2.0.4    ; ENC28J60 Ethernet (currently disabled)
